healthCheckTimeout: 1200
logLevel: info

models:
  # ─────────────────────────────────────────────────────────────────────
  # Qwen3.5-122B-A10B (llama.cpp, UD-Q4_K_XL)
  #
  # Role: Reasoning / planning / orchestration for agentic workflows.
  # 122B total params, 10B active per token (MoE).
  # UD-Q4_K_XL uses Unsloth Dynamic non-uniform quantization —
  # preserves quality on active MoE experts and attention layers.
  #
  # Memory: ~77 GB model weights.
  # KV cache: q4_0, 32768 context × 4 parallel slots = ~8 GB.
  # Total: ~85 GB, leaving ~26 GB headroom on 119 GB Spark.
  #
  # --parallel 4: real batching for concurrent sub-agent requests.
  # ─────────────────────────────────────────────────────────────────────
  qwen3.5-122b:
    cmd: >
      docker run --rm --name llama-qwen-122b
      --runtime=nvidia --gpus all --ipc=host
      --ulimit memlock=-1 --ulimit stack=67108864
      -p 0.0.0.0:9001:9001
      -v /home/max/.cache/huggingface:/root/.cache/huggingface
      ghcr.io/ggml-org/llama.cpp:server-cuda
      --host 0.0.0.0 --port 9001
      --alias qwen3.5-122b
      -m /root/.cache/huggingface/hub/models--unsloth--Qwen3.5-122B-A10B-GGUF/snapshots/51eab4d59d53f573fb9206cb3ce613f1d0aa392b/UD-Q4_K_XL/Qwen3.5-122B-A10B-UD-Q4_K_XL-00001-of-00003.gguf
      -ngl 999
      -c 262144
      --parallel 4
      -fa on
      --cache-type-k q4_0
      --cache-type-v q4_0
      --jinja
      --no-warmup
      --no-mmap
    proxy: http://127.0.0.1:9001
    checkEndpoint: /health
    ttl: 0

  # ─────────────────────────────────────────────────────────────────────
  # Gemma 4 E4B (llama.cpp, Q8_0)
  #
  # Role: Worker — tool calls, extraction, classification, routing.
  # ~8B total params, ~4.5B active. Q8_0 GGUF ~13 GB.
  #
  # 70ms TTFT for near-instant tool call responses.
  # --parallel 4: handles burst tool calls without queueing.
  # -c 8192: tool calls are short, no need for long context.
  # ─────────────────────────────────────────────────────────────────────
  gemma-4-e4b:
    cmd: >
      docker run --rm --name llama-gemma-e4b
      --runtime=nvidia --gpus all --ipc=host
      --ulimit memlock=-1 --ulimit stack=67108864
      -p 0.0.0.0:9007:9007
      -v /home/max/.cache/huggingface:/root/.cache/huggingface
      ghcr.io/ggml-org/llama.cpp:server-cuda
      --host 0.0.0.0 --port 9007
      --alias gemma-4-e4b
      -m /root/.cache/huggingface/hub/models--ggml-org--gemma-4-E4B-it-GGUF/snapshots/2714b5519c6c3516b1000e7c5e1eba998dfe1fe8/gemma-4-E4B-it-Q8_0.gguf
      --mmproj /root/.cache/huggingface/hub/models--ggml-org--gemma-4-E4B-it-GGUF/snapshots/2714b5519c6c3516b1000e7c5e1eba998dfe1fe8/mmproj-gemma-4-E4B-it-Q8_0.gguf
      -ngl 999
      -c 65536
      --parallel 4
      -fa on
      --cache-type-k q8_0
      --cache-type-v q8_0
      --jinja
      --no-warmup
      --no-mmap
    proxy: http://127.0.0.1:9007
    checkEndpoint: /health
    ttl: 0

groups:
  agent:
    swap: false
    exclusive: false
    members:
      - qwen3.5-122b
      - gemma-4-e4b
