      - qwen3.6-35b-a3b

groups:
  # ─── EXPERIMENTATION PHASE (2026-06-27) ────────────────────────────────
  # No dedicated production model. Every model is a swap-exclusive member of
  # this one group: exactly ONE loads at a time, on demand, and is unloaded
  # before the next loads. Co-resident pair RETIRED — when we want a model we
  # load it alone (full 119 GB available → can push context higher than the
  # old co-resident 0.40/0.50 mem-util splits allowed).
  #
  # Each member is being characterised on three axes (see README "Roster"
  # table + bin/bench-models.py): single-stream tok/s, cold load time, and
  # max usable context. The `qwen3.6-27b` / `qwen3.6-35b-a3b` aliases on
  # int4-dflash are kept only so legacy opencode clients still resolve.
  experiments:
    swap: true
    exclusive: true
    members:
      - nemotron-3-puzzle-75b     # NEW DEFAULT 2026-07-08: holds qwen3.6-27b / -35b-a3b aliases (MTP n=1 + graphs)
      - qwen3.6-27b-int4-dflash   # Intel INT4 + DFlash n=4 (former default; rollback target for the aliases)
      - qwen3.6-35b-a3b-nvfp4     # RedHatAI MoE NVFP4 + MTP n=1
      - qwen3.6-35b-a3b-vision    # NEW 2026-07-07: unsloth GGUF Q4_K_XL + mmproj (images, llama.cpp)
      - qwen3.6-27b-nvfp4         # NEW 2026-06-30: NVIDIA dense NVFP4, c=4 @ 131k
      - qwen3.6-27b-nvfp4-vision  # NEW 2026-07-05: same weights, vision encoder loaded (images)
      - qwen3.6-27b-fp8           # Qwen official FP8 + MTP n=3
      - qwopus3.6-27b-int4-dflash # Qwopus Opus-distill fine-tune, INT4+DFlash
      - ornith-1.0-35b            # NEW 2026-06-27: DeepReinforce 35B-A3B MoE (GGUF/llama.cpp)
      - diffusiongemma-26b        # Google diffusion LLM, NVFP4
      - cosmos3-nano-omni         # NEW 2026-06-27: NVIDIA Cosmos3-Nano omni world model (vLLM-Omni)
      - nemotron-3-nano-omni      # multimodal omni, NVFP4
      - deepseek-v4-flash-ds4     # antirez/ds4 native engine, long-ctx planner
      # ─── retired 2026-06-27 (rollback-slot cleanup) ────────────────────
      # qwen3.6-27b-int4-autoround, -sakamaki-mtp, -aeon-dflash, -mtp,
      #   -clean-dflash → superseded 27B slots (history: memory
      #   project_qwen36_27b_{dflash,sakamaki_mtp}). NVFP4 weights evicted.
      # deepseek-v4-flash (old llama.cpp fork) → superseded by -ds4 lane.
      # gemma-4-26b-a4b, minimax-m2.7, supergemma-4-26b, gemma-4-e4b removed 2026-05-02
      # qwen3.5-35b-distill, qwen3.5-122b-nvfp4 removed 2026-04-28 (3.5 gen)
