  # ─────────────────────────────────────────────────────────────────────
  # Qwen3.6-27B official FP8 + native MTP — PROMOTED 2026-05-08 (production).
  #
  # Replaces sakamakismile NVFP4+MTP-graft due to intermittent `</think>C`
  # truncation in real opencode coding traffic.
  #
  # Three deltas vs the demoted sakamaki entry:
  #   1. FP8 weights (block-128 fine-grained) instead of NVFP4 — reliability
  #      over a slight speed drop. Quality "nearly identical to original"
  #      per Qwen card. ~28 GB on disk (vs sakamaki's 19 GB).
  #   2. Native MTP head (no graft hack) — vLLM `qwen3_next_mtp` method, n=2
  #      (Qwen team's recommended setting from the FP8 model card).
  #   3. `--reasoning-parser qwen3` enabled — vLLM splits <think>...</think>
  #      into a separate `reasoning` field, opencode reads only `content`.
  #      Fixes the inline-think parsing ambiguity. Costs +3–7 s TTFT at short
  #      context (negligible at the user's 60k+ coding traffic).
  #
  # Image: vllm/vllm-openai:cu130-nightly (vanilla upstream, not the AEON-7
  # DFlash fork — Qwen FP8 path uses stock vLLM features only).
  # Cold start: ~10 min on first hit (CUDA-graph capture).
  # ─────────────────────────────────────────────────────────────────────
  qwen3.6-27b-fp8:
    cmd: /home/max/llm-stack/bin/launch-vllm-27b-qwen-fp8.sh
    proxy: http://127.0.0.1:9016
    checkEndpoint: /health
    ttl: 3600
