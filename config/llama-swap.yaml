  # ─────────────────────────────────────────────────────────────────────
  # Nemotron-3-Nano-Omni-30B-A3B Reasoning NVFP4 (vLLM) — added 2026-04-29.
  #
  # NVIDIA's Mamba2-Transformer hybrid MoE with vision + audio encoders.
  # Multimodal: text / image / audio / video. NVFP4 weights ~20.9 GB.
  # WHY:    Test slot for multimodal omni — different lane from the solo 27B
  #         coding workhorse. Heavy resource (full GPU mem util), so it lives
  #         in the `main` swap-exclusive group with the others.
  # NOTE:   Launcher: bin/launch-vllm-nemotron-omni.sh.
  #         max-model-len 131072 (model supports 262144 — raise if needed).
  # ─────────────────────────────────────────────────────────────────────
  nemotron-3-nano-omni:
    cmd: /home/max/llm-stack/bin/launch-vllm-nemotron-omni.sh
    proxy: http://127.0.0.1:9012
    checkEndpoint: /health
    ttl: 3600

  # ─────────────────────────────────────────────────────────────────────
  # DeepSeek V4 Flash IQ2_XXS — patched llama.cpp fork
  # (phuongncn/llama.cpp-gx10-dgx-sparks-deepseekv4) added 2026-04-28.
  #
  # WHY:    Upstream llama.cpp can't serve DeepSeek V4 above ~8k ctx — the
  #         compressor's metadata pool (~5 MB) and tensor-slot table (2k)
  #         overflow on the 41 compressed layers, which create ~350k tensor
  #         objects per token. The fork bumps pool→170 MB and slots→450k.
  # NOTE:   Repo benchmark: 8.48 PP / 6.65 gen tok/s. parallel=1 REQUIRED
  #         (multi-seq trips an assert in the compressor). 124 GB resident
  #         at 128k ctx — must remain swap-exclusive with `main` group.
  #         Native binary, not docker — needs the patched build.
  # ─────────────────────────────────────────────────────────────────────
  deepseek-v4-flash:
    cmd: >
      /home/max/llama.cpp-gx10-dsv4/build/bin/llama-server
      --host 127.0.0.1 --port 9011
      --alias deepseek-v4-flash
      -m /home/max/models/deepseek-v4-flash/DeepSeek-V4-Flash-IQ2XXS.gguf
      --ctx-size 65536
      --n-gpu-layers 99
      -b 4096 -ub 512
      -ctk f32 -ctv f32
      --parallel 1
      --threads 4 --threads-batch 20
      -fa on
      --no-mmap
      --reasoning-budget -1
      --jinja
    proxy: http://127.0.0.1:9011
    checkEndpoint: /health
    ttl: 3600

  # ─────────────────────────────────────────────────────────────────────
  # DeepSeek V4 Flash via antirez/ds4 (custom C/CUDA engine) — 2026-05-12.
  #
  # WHY:    Alternate V4-Flash lane. ds4 is a from-scratch implementation
  #         with compressed-KV that scales to 256k+ ctx on Spark, a built-in
  #         persistent disk KV cache (cold/continued/evict/shutdown), and
  #         native MTP speculative decoding. The parked llama.cpp-fork slot
  #         (port 9011) stays as rollback.
  # ROLE:   Planner-only lane. Decode is ~13 t/s on Spark q2-imatrix —
  #         NOT a coding workhorse. qwen3.6-27b-fp8 still owns coding.
  # NOTE:   Cold-load ~104s, warm ~74s (80.76 GiB tensor pages). checkEndpoint
  #         /v1/models — ds4-server has no /health, /v1/models is in source.
  #         Disk KV at /home/max/ds4/kv-cache, 32 GB budget, survives swap.
  # ─────────────────────────────────────────────────────────────────────
  deepseek-v4-flash-ds4:
    cmd: /home/max/llm-stack/bin/launch-ds4-server.sh
    proxy: http://127.0.0.1:9010
    checkEndpoint: /v1/models
    ttl: 3600

groups:
  # CO-RESIDENT QWEN GROUP (2026-05-17) — both engines stay loaded simultaneously.
  # Dense INT4+DFlash @ 120k c=1 (~56 GB) + MoE NVFP4 @ 80k c=2 (~45 GB) = ~101 GB.
  # Headroom ~14 GB for OS / cudagraph slack. NOT swap-exclusive: both can serve
  # in parallel via separate routes (qwen3.6-27b → dense, qwen3.6-35b-a3b-nvfp4
  # → MoE). Other heavy models in `main` below remain swap-exclusive; loading
  # one will OOM if these two are also loaded — user must manage explicitly.
  qwen-coresident:
    swap: false
    exclusive: false
    members:
      - qwen3.6-27b-int4-dflash
      - qwen3.6-35b-a3b-nvfp4

  # The main group: heavy models, only one active at a time. Co-resident qwen
  # group above is NOT cross-group exclusive — beware loading these while the
  # qwen pair is resident (~14 GB free, each main member needs ≥50 GB).
  main:
    swap: true
    exclusive: true
    members:
      - qwen3.6-27b-fp8           # rollback 2026-05-17 (was prod 2026-05-08; Qwen official FP8 + MTP n=3)
      - qwen3.6-27b-int4-autoround # eval 2026-05-17 (Intel INT4 + native MTP n=2, 22 tok/s)
      - qwen3.6-27b-sakamaki-mtp  # rollback 2026-05-08 (was prod, truncation bug)
      - qwen3.6-27b-aeon-dflash   # rollback 2026-05-08 (older)
      - qwen3.6-27b-mtp           # dormant rollback slot 2026-04-30
      - qwen3.6-27b-clean-dflash  # eval candidate 2026-05-08 (superseded)
      - nemotron-3-nano-omni
      - deepseek-v4-flash
      - deepseek-v4-flash-ds4     # added 2026-05-12 (antirez ds4 engine, planner lane)
      # gemma-4-26b-a4b, minimax-m2.7, supergemma-4-26b, gemma-4-e4b removed 2026-05-02
      # qwen3.6-35b-a3b removed 2026-04-27 (now alias of qwen3.6-27b)
      # qwen3.5-35b-distill, qwen3.5-122b-nvfp4 removed 2026-04-28 (3.5 gen)

  # qwen36 coexistence group REMOVED 2026-04-24 (solo 27B on Spark).
  # The MoE is disabled upstairs; the 27B moved into `main`.
