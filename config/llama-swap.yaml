  # to FP8.
  # NOTE:  max-num-seqs 2 is load-bearing per model card (fp8 KV + spec n=3 +
  #        200K ctx silently OOMs at max-num-seqs ≥ 4).
  # ─────────────────────────────────────────────────────────────────────
  qwen3.6-27b-sakamaki-mtp:
