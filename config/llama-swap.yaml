  # binding here (piecewise graph capture). MTP accept ~81%.
  # Bench (agg tok/s): short c1/c4 = 28/81, 125k c1/c4 = 20/12. Beats dense
  # 27B at long ctx; slower than the 35B MoE (eval finding, memory:
  # project_nemotron_puzzle_75b). n=2 variant (best single-stream 33 tok/s c1)
  # at scratchpad launch-mtp-n2.sh if a single-stream lane is wanted instead.
  # Port 9027. Reasoning model: <think>…</think> leaks into content.
  # ─────────────────────────────────────────────────────────────────────
  nemotron-3-puzzle-75b:
    cmd: /home/max/llm-stack/bin/launch-vllm-nemotron-puzzle-75b-mtp.sh
    proxy: http://127.0.0.1:9027
    checkEndpoint: /health
    ttl: 3600
