  # ─────────────────────────────────────────────────────────────────────
  # DeepSeek V4 Flash via antirez/ds4 (custom C/CUDA engine) — 2026-05-12.
  #
  # WHY:    Alternate V4-Flash lane. ds4 is a from-scratch implementation
  #         with compressed-KV that scales to 256k+ ctx on Spark, a built-in
  #         persistent disk KV cache (cold/continued/evict/shutdown), and
  #         native MTP speculative decoding. The parked llama.cpp-fork slot
  #         (port 9011) stays as rollback.
  # ROLE:   Planner-only lane. Decode is ~13 t/s on Spark q2-imatrix —
