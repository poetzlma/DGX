  # ─────────────────────────────────────────────────────────────────────
  # Qwen3.6-27B official FP8 + native MTP — PROMOTED 2026-05-08 (production).
  #
  # Replaces sakamakismile NVFP4+MTP-graft due to intermittent `</think>C`
  # truncation in real opencode coding traffic.
  #
  # Three deltas vs the demoted sakamaki entry:
  #   1. FP8 weights (block-128 fine-grained) instead of NVFP4 — reliability
  #      over a slight speed drop. Quality "nearly identical to original"
  #      per Qwen card. ~28 GB on disk (vs sakamaki's 19 GB).
  #   2. Native MTP head (no graft hack) — vLLM `qwen3_next_mtp` method, n=2
  #      (Qwen team's recommended setting from the FP8 model card).
  #   3. `--reasoning-parser qwen3` enabled — vLLM splits <think>...</think>
  #      into a separate `reasoning` field, opencode reads only `content`.
  #      Fixes the inline-think parsing ambiguity. Costs +3–7 s TTFT at short
  #      context (negligible at the user's 60k+ coding traffic).
  #
  # Image: vllm/vllm-openai:cu130-nightly (vanilla upstream, not the AEON-7
  # DFlash fork — Qwen FP8 path uses stock vLLM features only).
  # Cold start: ~10 min on first hit (CUDA-graph capture).
  # ─────────────────────────────────────────────────────────────────────
  qwen3.6-27b-fp8:
    cmd: /home/max/llm-stack/bin/launch-vllm-27b-qwen-fp8.sh
    proxy: http://127.0.0.1:9016
    checkEndpoint: /health
    ttl: 3600
    # ─── ROLLBACK to fp8 ─────────────────────────────────────────────────
    # If int4-dflash misbehaves in opencode coding traffic, move the
    # `qwen3.6-27b` + `qwen3.6-35b-a3b` aliases from `qwen3.6-27b-int4-dflash`
    # below back here. llama-swap -watch-config picks up the edit hot.

  # ─── RETIRED 2026-06-27: qwen3.6-27b-int4-autoround (Intel INT4 + MTP n=2,
  # 22 tok/s eval slot). Superseded by int4-dflash prod, which shares the same
  # Intel weights (NOT evicted). Launcher kept: launch-vllm-27b-int4-autoround.sh.

  # ─────────────────────────────────────────────────────────────────────
  # Qwen3.6-27B Intel AutoRound INT4 + z-lab DFlash drafter n=4 — PROMOTED
  # 2026-05-17 (production candidate).
  #
  # Was the fastest single-stream config we measured on 2026-05-17 after a
  # 4-hour optimization pass:
  #   - INT4 base only:               13.4 tok/s
  #   - INT4 + MTP n=2 (Intel card):  22 tok/s   (mean accept 2.26)
  #   - INT4 + MTP n=1:               19 tok/s
  #   - INT4 + DFlash n=8:            27 tok/s   (accept falls past pos 4)
  #   - INT4 + DFlash n=4:            27 tok/s   (winner — same throughput,
  #                                                less drafter waste, simpler)
  #   - AlphaOxO NVFP4 + DFlash n=15: 19 tok/s   (drafter overhead dominates)
  #
  # 50 tok/s target was NOT reached. AEON-7's published 37 tok/s on Spark
  # depends on FlashInfer NVFP4 GEMM autotune + their proprietary abliterated
  # weights (which we rolled back from for coding quality on 2026-05-08). On
  # Intel's INT4 base, GPTQ-Marlin kernel latency on sm121a (~100 ms/forward)
  # caps us in the high-20s. A drafter distilled specifically against the INT4
  # base (not the BF16/NVFP4 base) would lift acceptance past position 4 and
  # push toward 40+ tok/s; none such exists yet.
  #
  # Image: ghcr.io/aeon-7/vllm-aeon-ultimate-dflash:qwen36-v3 (same image as
  # the legacy AEON DFlash prod path — it bundles the sliding-window-attention
  # patch DFlash needs; vanilla v0.20.1 doesn't have it).
  # Cold start: ~6 min after first run (torch_compile + flashinfer cache hit).
  #
  # WHY we promoted anyway: user request "no need to switch back, put in
  # rotation". +22% over native MTP n=2, with the kaitchup 2026-05-12
  # accuracy-parity-with-FP8 result on INT4-AutoRound suggesting no quality
  # regression vs the previous fp8 prod. Real-traffic A/B is still warranted.
  # ─────────────────────────────────────────────────────────────────────
  qwen3.6-27b-int4-dflash:
    cmd: /home/max/llm-stack/bin/launch-vllm-27b-int4-dflash.sh
    proxy: http://127.0.0.1:9018
    checkEndpoint: /health
    ttl: 3600
    # ─── aliases qwen3.6-27b / qwen3.6-35b-a3b MOVED to nemotron-3-puzzle-75b
    # 2026-07-08 (new default under test). ROLLBACK: move both aliases back here.

