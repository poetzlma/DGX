healthCheckTimeout: 1200
logLevel: info

models:
  # ─────────────────────────────────────────────────────────────────────
  # Qwen3.6-35B-A3B MoE — DISABLED 2026-04-27.
  #
  # Legacy opencode sessions still send model="qwen3.6-35b-a3b" by default
  # and were repeatedly cold-swapping the 27B out. The name is now an
  # ALIAS of qwen3.6-27b (see that entry below) so old clients land on
  # the 27B transparently. To re-enable the real MoE, restore this block,
  # remove the alias on qwen3.6-27b, and add qwen3.6-35b-a3b back to the
  # `main` group members. Launcher kept: bin/launch-vllm-qwen.sh.
  # ─────────────────────────────────────────────────────────────────────
  # qwen3.6-35b-a3b:
  #   cmd: /home/max/llm-stack/bin/launch-vllm-qwen.sh
  #   proxy: http://127.0.0.1:9001
  #   checkEndpoint: /health
  #   ttl: 3600

  # ─────────────────────────────────────────────────────────────────────
  # Gemma 4 26B-A4B (llama.cpp, Q4_K_M)
  #
  # CHANGE 2026-04-15: Switched from vLLM to llama.cpp.
  # WHY:    Two compounding vLLM bugs make this model unusable:
  #         1. vLLM issue #39407/#39049: --quantization fp8 produces
  #            garbage output on ALL Gemma 4 variants.
  #         2. vLLM issue #38887: Gemma 4's heterogeneous head
  #            dimensions force TRITON_ATTN fallback, causing 10-15x
  #            slowdown.
  #
  # NOTE:   <SNAPSHOT_HASH> — resolve after downloading GGUF:
  #         hf download ggml-org/gemma-4-26B-A4B-it-GGUF --include "*Q4_K_M*"
  # ─────────────────────────────────────────────────────────────────────
  gemma-4-26b-a4b:
    cmd: >
      docker run --rm --name llama-gemma-26b
      --runtime=nvidia --gpus all --ipc=host
      --ulimit memlock=-1 --ulimit stack=67108864
      -p 0.0.0.0:9002:9002
      -v /home/max/.cache/huggingface:/root/.cache/huggingface
      ghcr.io/ggml-org/llama.cpp:server-cuda
      --host 0.0.0.0 --port 9002
      --alias gemma-4-26b-a4b
      -m /root/.cache/huggingface/hub/models--ggml-org--gemma-4-26B-A4B-it-GGUF/snapshots/ae4d537a6345467d1c86bb5cc0d4505ff3ebe0f3/gemma-4-26B-A4B-it-Q4_K_M.gguf
      -ngl 999
      -c 131072
      -fa on
      --cache-type-k q8_0
      --cache-type-v q8_0
      --jinja
      --no-warmup
      --no-mmap
    proxy: http://127.0.0.1:9002
    checkEndpoint: /health
    ttl: 3600

  # ─────────────────────────────────────────────────────────────────────
  # MiniMax M2.7 (llama.cpp, UD-IQ4_XS)
  #
  # CHANGE 2026-04-15: Quant switched from UD-Q3_K_XL to UD-IQ4_XS.
  # WHY:    UD-IQ4_XS (~60 GB) reduces active weight read by ~35%,
  #         pushing expected decode to ~40+ tok/s.
  #
  # CHANGE 2026-04-15: KV cache types from q8_0 to q4_0.
  #
  # NOTE:   <SNAPSHOT_HASH> — resolve after downloading GGUF:
  #         hf download unsloth/MiniMax-M2.7-GGUF --include "*UD-IQ4_XS*"
  # ─────────────────────────────────────────────────────────────────────
  minimax-m2.7:
    cmd: >
      docker run --rm --name llama-minimax
      --runtime=nvidia --gpus all --ipc=host
      --ulimit memlock=-1 --ulimit stack=67108864
      -p 0.0.0.0:9003:9003
      -v /home/max/.cache/huggingface:/root/.cache/huggingface
      ghcr.io/ggml-org/llama.cpp:server-cuda
      --host 0.0.0.0 --port 9003
      --alias minimax-m2.7
      -m /root/.cache/huggingface/hub/models--unsloth--MiniMax-M2.7-GGUF/snapshots/d2a05ccf69491b03db0cc40b335aec14bdaf7198/UD-IQ4_XS/MiniMax-M2.7-UD-IQ4_XS-00001-of-00004.gguf
      -ngl 999
      -c 98304
      --parallel 1
      -fa on
      --cache-type-k q4_0
      --cache-type-v q4_0
      --jinja
      --no-warmup
      --no-mmap
    proxy: http://127.0.0.1:9003
    checkEndpoint: /health
    ttl: 3600

  # ─────────────────────────────────────────────────────────────────────
  # SuperGemma 4 26B abliterated (llama.cpp, Q8_0)
  #
  # CHANGE 2026-04-15: Context reduced from 131072 to 65536.
  # CHANGE 2026-04-15: KV cache types from q8_0 to q4_0.
  # ─────────────────────────────────────────────────────────────────────
  supergemma-4-26b:
    cmd: >
      docker run --rm --name llama-supergemma
      --runtime=nvidia --gpus all --ipc=host
      --ulimit memlock=-1 --ulimit stack=67108864
      -p 0.0.0.0:9004:9004
      -v /home/max/.cache/huggingface:/root/.cache/huggingface
      ghcr.io/ggml-org/llama.cpp:server-cuda
      --host 0.0.0.0 --port 9004
      --alias supergemma-4-26b
      -m /root/.cache/huggingface/hub/models--Jiunsong--supergemma4-26b-abliterated-multimodal-gguf-8bit/snapshots/d178fe0a424abe8274275a0fa32ef8b3bd577d19/supergemma4-26b-abliterated-multimodal-Q8_0.gguf
      --mmproj /root/.cache/huggingface/hub/models--Jiunsong--supergemma4-26b-abliterated-multimodal-gguf-8bit/snapshots/d178fe0a424abe8274275a0fa32ef8b3bd577d19/mmproj-supergemma4-26b-abliterated-multimodal-f16.gguf
      -ngl 999
      -c 65536
      -fa on
      --cache-type-k q4_0
      --cache-type-v q4_0
      --jinja
      --no-warmup
      --no-mmap
    proxy: http://127.0.0.1:9004
    checkEndpoint: /health
    ttl: 3600

  # qwen3.5-35b-distill — REMOVED 2026-04-28. HF cache deleted to make room
