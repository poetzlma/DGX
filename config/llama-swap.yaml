healthCheckTimeout: 1200
logLevel: info

models:
  # ─────────────────────────────────────────────────────────────────────
  # Qwen3.6-35B-A3B MoE — DISABLED 2026-04-27.
  #
  # Legacy opencode sessions still send model="qwen3.6-35b-a3b" by default
  # and were repeatedly cold-swapping the 27B out. The name is now an
  # ALIAS of qwen3.6-27b (see that entry below) so old clients land on
  # the 27B transparently. To re-enable the real MoE, restore this block,
  # remove the alias on qwen3.6-27b, and add qwen3.6-35b-a3b back to the
  # `main` group members. Launcher kept: bin/launch-vllm-qwen.sh.
  # ─────────────────────────────────────────────────────────────────────
  # qwen3.6-35b-a3b:
  #   cmd: /home/max/llm-stack/bin/launch-vllm-qwen.sh
  #   proxy: http://127.0.0.1:9001
  #   checkEndpoint: /health
  #   ttl: 3600

  # gemma-4-26b-a4b — REMOVED 2026-05-02. MoE retired (2026-04-24 "MoE out, solo
  # 27B in"). HF cache deleted (BF16 + Q4_K_M GGUF, 65 GB total). To restore:
  # re-download google/gemma-4-26B-A4B-it + ggml-org/gemma-4-26B-A4B-it-GGUF
  # and revert this commit.

  # minimax-m2.7 — REMOVED 2026-05-02. MoE retired. HF cache deleted (196 GB,
  # UD-IQ4_XS GGUF). To restore: re-download unsloth/MiniMax-M2.7-GGUF and
  # revert this commit.

  # supergemma-4-26b — REMOVED 2026-05-02. MoE retired. HF cache deleted
  # (27 GB Q8_0 multimodal GGUF). To restore: re-download
  # Jiunsong/supergemma4-26b-abliterated-multimodal-gguf-8bit and revert.

  # qwen3.5-35b-distill — REMOVED 2026-04-28. HF cache deleted to make room
  # for DeepSeek-V4 deployment. To restore: re-download
  # Jackrong/Qwen3.5-35B-A3B-Claude-4.6-Opus-Reasoning-Distilled and revert
  # this commit. (3.5 generation, superseded by 3.6 stack anyway.)

  # qwen3.5-122b-nvfp4 — REMOVED 2026-04-28. HF cache deleted to make room
  # for DeepSeek-V4 deployment. To restore: re-download
  # RedHatAI/Qwen3.5-122B-A10B-NVFP4 and revert this commit.

  # gemma-4-e4b — REMOVED 2026-05-02. No longer needed in stack. HF cache
  # deleted (BF16 + Q8_0 GGUF, 23 GB total). To restore: re-download
  # google/gemma-4-E4B-it + ggml-org/gemma-4-E4B-it-GGUF and revert.

  # ─────────────────────────────────────────────────────────────────────
  # Qwen3.6-27B dense (vLLM AEON-7 NVFP4 + DFlash k=15) — solo coding stack.
  #
  # CHANGE 2026-04-30: Promoted DFlash over MTP after head-to-head bench.
  #         Previous AlphaOxO NVFP4 + MTP n=3 path moved to qwen3.6-27b-mtp
  #         (dormant, addressable for rollback). Bench, same SHORT_MSGS sweep:
  #           c=1:  41.0 tok/s  (vs MTP 20.3, +102 %)
  #           c=5:  139.0       (vs 92.0,    +51 %)
  #           c=10: 207.1 agg   (vs 169.1,   +22 %)
  #           c=1 burst peak (engine log): 79.5 vs 22.0 → 3.6× decode rate
  #         TTFT lower across the board. KV budget shrinks vs MTP
  #         (205 k vs 552 k tokens at max-model-len 200 k vs 262 k) — fine for
  #         current workload but tighter ceiling on long-prefill concurrency.
  # WHY:    Drafter + DFlash spec method outperforms in-target MTP head on
  #         GB10's unified-memory bandwidth (decode-bound regime).
  # NOTE:   Cold start ~10 min (FlashInfer NVFP4 GEMM autotuner + CUDA-graph).
  # ─────────────────────────────────────────────────────────────────────
  qwen3.6-27b:
    cmd: /home/max/llm-stack/bin/launch-vllm-27b-dflash.sh
    proxy: http://127.0.0.1:9013
    checkEndpoint: /health
    ttl: 3600
    aliases:
      - qwen3.6-35b-a3b      # legacy opencode sessions land here (added 2026-04-27)
      - qwen3.6-27b-dflash   # explicit DFlash name still valid (added 2026-04-30)
    # ─── ROLLBACK (30-second revert to MTP) ──────────────────────────────
    # If DFlash misbehaves, swap the cmd line above for:
    #   cmd: /home/max/llm-stack/bin/launch-vllm-27b-nvfp4.sh
    #   proxy: http://127.0.0.1:9008
    # llama-swap -watch-config picks up yaml edits without restart.
    # The MTP launcher is also kept addressable as `qwen3.6-27b-mtp` below.

  # ─────────────────────────────────────────────────────────────────────
  # Qwen3.6-27B dense + MTP — DORMANT rollback slot (kept 2026-04-30).
  #
  # Was production 2026-04-24 → 2026-04-30. Demoted in favor of DFlash above.
  # Addressable by explicit name `qwen3.6-27b-mtp` for A/B or rollback.
  # Same launcher, port 9008, container vllm-qwen-27b — but
  # --served-model-name is now `qwen3.6-27b-mtp` only (no longer aliases the
  # default name) so requests to qwen3.6-27b never land here unintentionally.
  # ─────────────────────────────────────────────────────────────────────
  qwen3.6-27b-mtp:
    cmd: /home/max/llm-stack/bin/launch-vllm-27b-nvfp4.sh
    proxy: http://127.0.0.1:9008
    checkEndpoint: /health
    ttl: 3600

  # ─────────────────────────────────────────────────────────────────────
  # Nemotron-3-Nano-Omni-30B-A3B Reasoning NVFP4 (vLLM) — added 2026-04-29.
  #
  # NVIDIA's Mamba2-Transformer hybrid MoE with vision + audio encoders.
  # Multimodal: text / image / audio / video. NVFP4 weights ~20.9 GB.
  # WHY:    Test slot for multimodal omni — different lane from the solo 27B
  #         coding workhorse. Heavy resource (full GPU mem util), so it lives
  #         in the `main` swap-exclusive group with the others.
  # NOTE:   Launcher: bin/launch-vllm-nemotron-omni.sh.
  #         max-model-len 131072 (model supports 262144 — raise if needed).
  # ─────────────────────────────────────────────────────────────────────
  nemotron-3-nano-omni:
    cmd: /home/max/llm-stack/bin/launch-vllm-nemotron-omni.sh
    proxy: http://127.0.0.1:9012
    checkEndpoint: /health
    ttl: 3600

  # ─────────────────────────────────────────────────────────────────────
  # DeepSeek V4 Flash IQ2_XXS — patched llama.cpp fork
  # (phuongncn/llama.cpp-gx10-dgx-sparks-deepseekv4) added 2026-04-28.
  #
  # WHY:    Upstream llama.cpp can't serve DeepSeek V4 above ~8k ctx — the
  #         compressor's metadata pool (~5 MB) and tensor-slot table (2k)
  #         overflow on the 41 compressed layers, which create ~350k tensor
  #         objects per token. The fork bumps pool→170 MB and slots→450k.
  # NOTE:   Repo benchmark: 8.48 PP / 6.65 gen tok/s. parallel=1 REQUIRED
  #         (multi-seq trips an assert in the compressor). 124 GB resident
  #         at 128k ctx — must remain swap-exclusive with `main` group.
  #         Native binary, not docker — needs the patched build.
  # ─────────────────────────────────────────────────────────────────────
  deepseek-v4-flash:
    cmd: >
      /home/max/llama.cpp-gx10-dsv4/build/bin/llama-server
      --host 127.0.0.1 --port 9011
      --alias deepseek-v4-flash
      -m /home/max/models/deepseek-v4-flash/DeepSeek-V4-Flash-IQ2XXS.gguf
      --ctx-size 65536
      --n-gpu-layers 99
      -b 4096 -ub 512
      -ctk f32 -ctv f32
      --parallel 1
      --threads 4 --threads-batch 20
      -fa on
      --no-mmap
      --reasoning-budget -1
      --jinja
    proxy: http://127.0.0.1:9011
    checkEndpoint: /health
    ttl: 3600

groups:
  # The main group: heavy models, only one active at a time.
  # CHANGE 2026-04-24: qwen3.6-27b joined (solo NVFP4+MTP, was in qwen36 pair).
  # At --gpu-memory-utilization 0.92 it consumes ~110 GB on its own — must
  # swap-exclusive with the other heavies or any request for a main-group
  # model would OOM. Cold-start ~2-3 min in either direction.
  main:
    swap: true
    exclusive: true
    members:
      - qwen3.6-27b
      - qwen3.6-27b-mtp         # dormant rollback slot 2026-04-30
      - nemotron-3-nano-omni
      - deepseek-v4-flash
      # gemma-4-26b-a4b, minimax-m2.7, supergemma-4-26b, gemma-4-e4b removed 2026-05-02
      # qwen3.6-35b-a3b removed 2026-04-27 (now alias of qwen3.6-27b)
      # qwen3.5-35b-distill, qwen3.5-122b-nvfp4 removed 2026-04-28 (3.5 gen)

  # qwen36 coexistence group REMOVED 2026-04-24 (solo 27B on Spark).
  # The MoE is disabled upstairs; the 27B moved into `main`.
