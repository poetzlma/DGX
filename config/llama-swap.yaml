groups:
  # The main group: heavy models, only one active at a time.
  main:
    swap: true
    exclusive: true
    members:
      - gemma-4-26b-a4b
      - minimax-m2.7
      - supergemma-4-26b
      - qwen3.5-35b-distill
      - qwen3.5-122b-nvfp4
      - gemma-4-e4b

  # Qwen 3.6 coexistence pair (NVFP4 35B + UD-Q4_K_XL 27B).
  # Combined ~50 GB footprint; both stay resident while in use.
  # NOTE: members here do not auto-evict `main` models and vice versa,
  # so if memory gets tight, manually /unload via llama-swap API.
  qwen36:
    swap: false
    members:
      - qwen3.6-35b-a3b
      - qwen3.6-27b
