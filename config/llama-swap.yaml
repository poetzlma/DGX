healthCheckTimeout: 1200
logLevel: info

models:
  # ─────────────────────────────────────────────────────────────────────
  # Qwen3.6-35B-A3B MoE (vLLM, NVFP4) — DORMANT (on-demand) since 2026-04-24
  #
  # Solo 27B NVFP4+MTP is the default coding stack. The MoE entry is kept
  # routable via swap-exclusive `main` group: a request to qwen3.6-35b-a3b
  # cold-starts it and evicts whatever heavy is currently up (27B etc.).
  # Launcher: bin/launch-vllm-qwen.sh (RedHatAI/Qwen3.6-35B-A3B-NVFP4).
  # ─────────────────────────────────────────────────────────────────────
  qwen3.6-35b-a3b:
    cmd: /home/max/llm-stack/bin/launch-vllm-qwen.sh
    proxy: http://127.0.0.1:9001
    checkEndpoint: /health
    ttl: 3600

  # ─────────────────────────────────────────────────────────────────────
  # Gemma 4 26B-A4B (llama.cpp, Q4_K_M)
  #
  # CHANGE 2026-04-15: Switched from vLLM to llama.cpp.
  # WHY:    Two compounding vLLM bugs make this model unusable:
  #         1. vLLM issue #39407/#39049: --quantization fp8 produces
  #            garbage output on ALL Gemma 4 variants.
  #         2. vLLM issue #38887: Gemma 4's heterogeneous head
  #            dimensions force TRITON_ATTN fallback, causing 10-15x
  #            slowdown.
  #
  # NOTE:   <SNAPSHOT_HASH> — resolve after downloading GGUF:
  #         hf download ggml-org/gemma-4-26B-A4B-it-GGUF --include "*Q4_K_M*"
  # ─────────────────────────────────────────────────────────────────────
  gemma-4-26b-a4b:
    cmd: >
      docker run --rm --name llama-gemma-26b
      --runtime=nvidia --gpus all --ipc=host
      --ulimit memlock=-1 --ulimit stack=67108864
      -p 0.0.0.0:9002:9002
      -v /home/max/.cache/huggingface:/root/.cache/huggingface
      ghcr.io/ggml-org/llama.cpp:server-cuda
      --host 0.0.0.0 --port 9002
      --alias gemma-4-26b-a4b
      -m /root/.cache/huggingface/hub/models--ggml-org--gemma-4-26B-A4B-it-GGUF/snapshots/ae4d537a6345467d1c86bb5cc0d4505ff3ebe0f3/gemma-4-26B-A4B-it-Q4_K_M.gguf
      -ngl 999
      -c 131072
      -fa on
      --cache-type-k q8_0
      --cache-type-v q8_0
      --jinja
      --no-warmup
      --no-mmap
    proxy: http://127.0.0.1:9002
    checkEndpoint: /health
    ttl: 3600

  # ─────────────────────────────────────────────────────────────────────
  # MiniMax M2.7 (llama.cpp, UD-IQ4_XS)
  #
  # CHANGE 2026-04-15: Quant switched from UD-Q3_K_XL to UD-IQ4_XS.
  # WHY:    UD-IQ4_XS (~60 GB) reduces active weight read by ~35%,
  #         pushing expected decode to ~40+ tok/s.
  #
  # CHANGE 2026-04-15: KV cache types from q8_0 to q4_0.
  #
  # NOTE:   <SNAPSHOT_HASH> — resolve after downloading GGUF:
  #         hf download unsloth/MiniMax-M2.7-GGUF --include "*UD-IQ4_XS*"
  # ─────────────────────────────────────────────────────────────────────
  minimax-m2.7:
    cmd: >
      docker run --rm --name llama-minimax
      --runtime=nvidia --gpus all --ipc=host
      --ulimit memlock=-1 --ulimit stack=67108864
      -p 0.0.0.0:9003:9003
      -v /home/max/.cache/huggingface:/root/.cache/huggingface
      ghcr.io/ggml-org/llama.cpp:server-cuda
      --host 0.0.0.0 --port 9003
      --alias minimax-m2.7
      -m /root/.cache/huggingface/hub/models--unsloth--MiniMax-M2.7-GGUF/snapshots/d2a05ccf69491b03db0cc40b335aec14bdaf7198/UD-IQ4_XS/MiniMax-M2.7-UD-IQ4_XS-00001-of-00004.gguf
      -ngl 999
      -c 98304
      --parallel 1
      -fa on
      --cache-type-k q4_0
      --cache-type-v q4_0
      --jinja
      --no-warmup
      --no-mmap
    proxy: http://127.0.0.1:9003
    checkEndpoint: /health
    ttl: 3600

  # ─────────────────────────────────────────────────────────────────────
  # SuperGemma 4 26B abliterated (llama.cpp, Q8_0)
  #
  # CHANGE 2026-04-15: Context reduced from 131072 to 65536.
  # CHANGE 2026-04-15: KV cache types from q8_0 to q4_0.
  # ─────────────────────────────────────────────────────────────────────
  supergemma-4-26b:
    cmd: >
      docker run --rm --name llama-supergemma
      --runtime=nvidia --gpus all --ipc=host
      --ulimit memlock=-1 --ulimit stack=67108864
      -p 0.0.0.0:9004:9004
      -v /home/max/.cache/huggingface:/root/.cache/huggingface
      ghcr.io/ggml-org/llama.cpp:server-cuda
      --host 0.0.0.0 --port 9004
      --alias supergemma-4-26b
      -m /root/.cache/huggingface/hub/models--Jiunsong--supergemma4-26b-abliterated-multimodal-gguf-8bit/snapshots/d178fe0a424abe8274275a0fa32ef8b3bd577d19/supergemma4-26b-abliterated-multimodal-Q8_0.gguf
      --mmproj /root/.cache/huggingface/hub/models--Jiunsong--supergemma4-26b-abliterated-multimodal-gguf-8bit/snapshots/d178fe0a424abe8274275a0fa32ef8b3bd577d19/mmproj-supergemma4-26b-abliterated-multimodal-f16.gguf
      -ngl 999
      -c 65536
      -fa on
      --cache-type-k q4_0
      --cache-type-v q4_0
      --jinja
      --no-warmup
      --no-mmap
    proxy: http://127.0.0.1:9004
    checkEndpoint: /health
    ttl: 3600

  # ─────────────────────────────────────────────────────────────────────
  # Qwen3.5-35B-A3B Claude Opus Distilled (vLLM, BF16)
  #
  # CHANGE 2026-04-15: Added MTP speculative decoding.
  # CHANGE 2026-04-15: Added --enable-prefix-caching.
  # CHANGE 2026-04-15: Added --attention-backend FLASHINFER.
  # ─────────────────────────────────────────────────────────────────────
  qwen3.5-35b-distill:
    cmd: >
      docker run --rm --name vllm-qwen-distill
      --runtime=nvidia --gpus all --ipc=host
      --ulimit memlock=-1 --ulimit stack=67108864
      -p 0.0.0.0:9005:9005
      -v /home/max/.cache/huggingface:/root/.cache/huggingface
      -e HF_TOKEN_FILE=/root/.cache/huggingface/token
      -e VLLM_FLASHINFER_MOE_BACKEND=latency
      -e VLLM_ENGINE_READY_TIMEOUT_S=1800
      vllm/vllm-openai:cu130-nightly
      Jackrong/Qwen3.5-35B-A3B-Claude-4.6-Opus-Reasoning-Distilled
      --host 0.0.0.0 --port 9005
      --served-model-name qwen3.5-35b-distill
      --max-model-len 8192
      --max-num-batched-tokens 8192
      --kv-cache-dtype fp8
      --enable-prefix-caching
      --gpu-memory-utilization 0.85
      --language-model-only
      --reasoning-parser qwen3
      --attention-backend FLASHINFER
      --enable-auto-tool-choice
      --tool-call-parser qwen3_coder
      --speculative-config '{"method":"mtp","num_speculative_tokens":1}'
    proxy: http://127.0.0.1:9005
    checkEndpoint: /health
    ttl: 3600

  # ─────────────────────────────────────────────────────────────────────
  # Qwen3.5-122B-A10B NVFP4 (vLLM)
  #
  # CHANGE 2026-04-15: Added --kv-cache-dtype fp8.
  # CHANGE 2026-04-15: Added --attention-backend FLASHINFER.
  # CHANGE 2026-04-15: Removed -e VLLM_FLASHINFER_MOE_BACKEND=latency.
  # ─────────────────────────────────────────────────────────────────────
  qwen3.5-122b-nvfp4:
    cmd: >
      docker run --rm --name vllm-qwen-nvfp4
      --runtime=nvidia --gpus all --ipc=host
      --ulimit memlock=-1 --ulimit stack=67108864
      -p 0.0.0.0:9006:9006
      -v /home/max/.cache/huggingface:/root/.cache/huggingface
      -e HF_TOKEN_FILE=/root/.cache/huggingface/token
      -e VLLM_ENGINE_READY_TIMEOUT_S=1800
      vllm/vllm-openai:cu130-nightly
      RedHatAI/Qwen3.5-122B-A10B-NVFP4
      --host 0.0.0.0 --port 9006
      --served-model-name qwen3.5-122b-nvfp4
      --max-model-len 65536
      --max-num-batched-tokens 8192
      --kv-cache-dtype fp8
      --enable-prefix-caching
      --gpu-memory-utilization 0.80
      --moe-backend flashinfer_cutlass
      --language-model-only
      --reasoning-parser qwen3
      --attention-backend FLASHINFER
      --enable-auto-tool-choice
      --tool-call-parser qwen3_coder
    proxy: http://127.0.0.1:9006
    checkEndpoint: /health
    ttl: 3600

  # ─────────────────────────────────────────────────────────────────────
  # Gemma 4 E4B (llama.cpp, Q8_0)
  #
  # CHANGE 2026-04-15: Switched from vLLM to llama.cpp.
  # CHANGE 2026-04-15: Using Q8_0 GGUF.
  # ─────────────────────────────────────────────────────────────────────
  gemma-4-e4b:
    cmd: >
      docker run --rm --name llama-gemma-e4b
      --runtime=nvidia --gpus all --ipc=host
      --ulimit memlock=-1 --ulimit stack=67108864
      -p 0.0.0.0:9007:9007
      -v /home/max/.cache/huggingface:/root/.cache/huggingface
      ghcr.io/ggml-org/llama.cpp:server-cuda
      --host 0.0.0.0 --port 9007
      --alias gemma-4-e4b
      -m /root/.cache/huggingface/hub/models--ggml-org--gemma-4-E4B-it-GGUF/snapshots/2714b5519c6c3516b1000e7c5e1eba998dfe1fe8/gemma-4-E4B-it-Q8_0.gguf
      -ngl 999
      -c 131072
      -fa on
      --cache-type-k q8_0
      --cache-type-v q8_0
      --jinja
      --no-warmup
      --no-mmap
    proxy: http://127.0.0.1:9007
    checkEndpoint: /health
    ttl: 3600

  # ─────────────────────────────────────────────────────────────────────
  # Qwen3.6-27B dense (vLLM NVFP4 + MTP n=3) — solo coding stack.
  #
  # CHANGE 2026-04-24: Replaced llama.cpp GGUF with AlphaOxO NVFP4 + native
  #         MTP on vLLM cu130-nightly. Benched:
  #           19 tok/s c=1   (vs 11 GGUF)
  #           154 tok/s c=10 agg (vs ~25 GGUF) → 6×
  # WHY:    With the MoE now disabled, the 27B takes the full 119 GiB
  #         budget and handles both "deep reasoning" and "parallel workers"
  #         at once, without the MoE's quality-per-token tax.
  # NOTE:   Needs num_nextn_predict_layers=1 patch on AlphaOxO's config.json.
  #         See ~/llm-stack/README.md §MTP-patch for the one-liner.
  # ─────────────────────────────────────────────────────────────────────
  qwen3.6-27b:
    cmd: /home/max/llm-stack/bin/launch-vllm-27b-nvfp4.sh
    proxy: http://127.0.0.1:9010
    checkEndpoint: /health
    ttl: 3600
    # ─── ROLLBACK (30-second revert) ────────────────────────────────────
    # If the vLLM path misbehaves, comment the `cmd:` above and uncomment
    # this llama.cpp GGUF block, then `sudo systemctl restart llama-swap`.
    # cmd: >
    #   docker run --rm --name llama-qwen-27b
    #   --runtime=nvidia --gpus all --ipc=host
    #   --ulimit memlock=-1 --ulimit stack=67108864
    #   -p 0.0.0.0:9008:9008
    #   -v /home/max/.cache/huggingface:/root/.cache/huggingface
    #   ghcr.io/ggml-org/llama.cpp:server-cuda
    #   --host 0.0.0.0 --port 9008
    #   --alias qwen3.6-27b
    #   -m /root/.cache/huggingface/hub/models--unsloth--Qwen3.6-27B-GGUF/snapshots/82d411acf4a06cfb8d9b073a5211bf410bfc29bf/Qwen3.6-27B-UD-Q4_K_XL.gguf
    #   --no-mmproj -ngl 999 -c 131072 -fa on --no-mmap --kv-unified
    #   -b 4096 -ub 2048 --jinja
    #   --temp 0.6 --top-p 0.95 --top-k 20 --min-p 0.0
    #   --presence-penalty 1.5 --reasoning on
    #   --chat-template-kwargs '{"preserve_thinking": true}'

groups:
  # The main group: heavy models, only one active at a time.
  # CHANGE 2026-04-24: qwen3.6-27b joined (solo NVFP4+MTP, was in qwen36 pair).
  # At --gpu-memory-utilization 0.92 it consumes ~110 GB on its own — must
  # swap-exclusive with the other heavies or any request for a main-group
  # model would OOM. Cold-start ~2-3 min in either direction.
  main:
    swap: true
    exclusive: true
    members:
      - gemma-4-26b-a4b
      - minimax-m2.7
      - supergemma-4-26b
      - qwen3.5-35b-distill
      - qwen3.5-122b-nvfp4
      - gemma-4-e4b
      - qwen3.6-27b
      - qwen3.6-35b-a3b

  # qwen36 coexistence group REMOVED 2026-04-24 (solo 27B on Spark).
  # The MoE is disabled upstairs; the 27B moved into `main`.
