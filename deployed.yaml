# Deployed LLM stack manifest — source of truth for downstream clients & proxies.
#
# HOW TO READ THIS FILE
#   `live:`      what is serving RIGHT NOW. If you are configuring a client,
#                read this block and stop. It is complete on its own.
#   `gateway:`   where to send requests.
#   `model_list:` drop-in LiteLLM proxy config (mechanical; mirrors `live:`).
#   `not_serving:` history — dormant, dark, and retired lanes. NOTHING in that
#                block answers a request today. Do not configure a client from it.
#
# Last verified against the running stack: 2026-08-17
#   curl -s http://127.0.0.1:8080/running   # -> qwen3.8-27b, state ready
# If this file disagrees with that command, the command wins and this file is a
# bug. Fix it in the same session.

# ═══════════════════════════════════════════════════════════════════════════
# LIVE — the entire client contract
# ═══════════════════════════════════════════════════════════════════════════
live:
  model_id: qwen3.8-27b            # put THIS id in new client configs
  since: 2026-08-16                # cutover; docs/decisions.md §42 + addendum
  status: resident (always loaded, sole engine on the box)

  # ── The four numbers a coding harness must configure ──────────────────
  context_window: 262144           # prompt + output. Verified served @259,778
  max_output_tokens: 32768         # RECOMMENDED client cap. No separate engine
                                   # limit — the only hard bound is
                                   # prompt+output <= context_window. Do not set
                                   # below ~2000: thinking is charged against
                                   # this budget and can consume it entirely.
  request_timeout_s: 1200          # cold TTFT is 178 s @141k, ~390 s @260k.
                                   # Do not lower below 900.
  max_concurrent_requests: 4       # engine serves 4; aggregate throughput is
                                   # FLAT past 2 (bandwidth wall). 1-2 in flight
                                   # is the efficient shape; 4 will not error.

  # ── Capabilities ──────────────────────────────────────────────────────
  vision: true                     # image:4, video:1 per prompt. Enabled
                                   # 2026-08-16 — first vision lane since 08-01.
                                   # No thinking-spiral on images (unlike 3.6).
  tools: true                      # OpenAI tool-calling, qwen3_coder parser
  streaming: true                  # recommended; reasoning streams incrementally
  thinking: true                   # reasoning model, always on

  # ── API-shape gotcha: read this before writing a client ───────────────
  thinking_field: reasoning        # <-- NOT `reasoning_content`. The qwen3
                                   # reasoning parser emits `reasoning`. The
                                   # previous resident (ds4) used
                                   # `reasoning_content`. A client reading only
                                   # one field silently shows empty responses.
                                   # READ BOTH. (feedback_reasoning_field_name)

  sampling_defaults:               # the model's own generation_config.json.
    temperature: 1.0               # Do NOT override with hosted-API generics —
    top_p: 0.95                    # `--generation-config vllm` silently
    top_k: 20                      # replaced these and was removed as a bug.

  # ── Aliases: NONE. Retired 2026-08-17. ────────────────────────────────
  # `qwen3.8-27b` is the only route the gateway serves and the only model any
  # key is scoped to. The six legacy names (deepseek-v4-flash-0731,
  # deepseek-v4-flash-ds4, laguna-s-2.1, nemotron-3-puzzle-75b, qwen3.6-27b,
  # qwen3.6-35b-a3b) were removed so `/v1/models` stops advertising a menu of
  # routes that mostly 400. A client still sending one of those gets an
  # unknown-model error — the fix is to change the client's model id, not to
  # re-add the alias.
  aliases: []

  # ── Serving detail (operators; clients can ignore) ────────────────────
  engine:
    weights: unsloth/Qwen3.8-27B-NVFP4 (22.4 GB compressed-tensors mixed quant)
    runtime: vLLM, pinned image vllm-qwen38:prod-20260816 (sha256:677afd5b…)
    launcher: bin/launch-vllm-qwen38-prod.sh   # every flag justified in header
    port_internal: 9030
    config: max-model-len=262144 max-num-seqs=4 gpu-mem-util=0.70
            max-num-batched-tokens=16384 kv=fp8 mamba-cache=fp32
            speculative=mtp:n3 tool-call-parser=qwen3_coder
            reasoning-parser=qwen3 limit-mm-per-prompt=image:4,video:1
    measured_decode_tok_s: {2k: 26.8, 60k: 22.7, 141k: 22.9}   # post fp8-KV
    measured_cold_ttft_s: {141k: 178}
    rollback: bin/rollback-to-ds4.sh   # stops qwen FIRST — order is load-bearing

gateway:
  url: http://192.168.1.12:8079/v1
  api_key: not-needed   # LAN-only; the authed public edge is Cloudflare/LiteLLM on .7
  request_timeout_min_s: 1200
  # :8079 is log-proxy, which forwards to llama-swap on :8080 and captures
  # req+resp+meta per call to ~/llm-stack/logs/proxy/{date}/{model}/.
  # Reverting any api_base to :8080 silently drops all observability.

# ═══════════════════════════════════════════════════════════════════════════
# LiteLLM model_list — drop-in for the proxy config on .7
# ═══════════════════════════════════════════════════════════════════════════
# ONE ROUTE, deliberately (2026-08-17). The gateway serves exactly the model
# that is loaded, and nothing else. Previously this list carried 18 names: the
# resident, six legacy aliases, and eleven dormant lanes that returned HTTP 400
# ("could not find suitable inference handler"). `/v1/models` advertised all of
# them, so every client — human or agent — saw a menu where 11 of 18 items did
# not exist. All 12 API keys are now scoped to `qwen3.8-27b` alone, so the
# catalog, the allowlists, and the loaded engine finally agree.
#
# Re-adding a route means all three: an entry here, the model loadable in
# config/llama-swap.yaml, AND the name added to the keys that should reach it.
#
# PRICING: $0.10/1M in, $0.40/1M out — cost-recovery, not a market rate.
# Re-check on every resident change: a price left behind on a route now backed
# by a different model bills the wrong rate silently (§38). Verify with the
# standing check — rows where `spend = 0 AND prompt_tokens > 0`.
model_list:
  - model_name: qwen3.8-27b
    litellm_params:
      model: openai/qwen3.8-27b
      api_base: http://192.168.1.12:8079/v1
      api_key: not-needed
      input_cost_per_token: 0.0000001
      output_cost_per_token: 0.0000004

litellm_settings:
  request_timeout: 1200   # cold-start + copy-back pull headroom; do not lower below 900

# ═══════════════════════════════════════════════════════════════════════════
# NOT SERVING — history. Nothing below answers a request today.
# ═══════════════════════════════════════════════════════════════════════════
# Read this only when reviving a lane or tracing why something is configured the
# way it is. Do NOT configure a client from anything here: the numbers describe
# each lane AS IT RAN, not what its route name serves now (every legacy route
# name in `live.aliases` resolves to qwen3.8-27b today, at qwen3.8's window).
#
# Two gates on reviving anything:
#   1. config/llama-swap.yaml is in LOCKED MODE (resident only). Restore
#      config/llama-swap.full.bak to make these loadable at all.
#   2. Several lanes' weights were DELETED to reclaim disk. "Rollback" for those
#      is a multi-GB download, not a config swap. Check ~/.cache/huggingface/hub/
#      before proposing one.
# Only ONE non-resident engine may load at a time, and prod must be parked first
# (bin/park-prod-ds4.sh) — the box hard-hangs on host OOM, 3 power cycles to date.

not_serving:

  # ── DORMANT: on disk, revivable, is the production rollback ───────────
