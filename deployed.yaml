# Reverting any api_base to :8080 silently drops observability.
model_list:
  - model_name: nemotron-3-puzzle-75b   # NEW DEFAULT under test 2026-07-08 (also holds the qwen3.6-27b / -35b-a3b aliases)
    litellm_params:
      model: openai/nemotron-3-puzzle-75b
      api_base: http://192.168.1.12:8079/v1
      api_key: not-needed

  - model_name: qwen3.6-27b           # DEFAULT → nemotron-3-puzzle-75b 2026-07-08 (mapped at GATEWAY: llama-swap v201 -watch-config drops aliases, so forward the real name — see memory feedback_llama_swap_alias_reload)
    litellm_params:
      model: openai/nemotron-3-puzzle-75b
      api_base: http://192.168.1.12:8079/v1
      api_key: not-needed

