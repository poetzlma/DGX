    status: dormant — PRODUCTION ROLLBACK TARGET
    was: coding default 2026-08-01 → 2026-08-16
    method: DeepSeek-V4-Flash-0731 (304B MoE, 13B active, MLA) IQ2_XXS imatrix
            GGUF on the Entrpi/ds4 fork v0.5.6.2 — native binary, not docker
    port_internal: 9010
    context_window_when_live: 131072   # HARD CAP — 262144 caused a ~35-min
                                       # outage 2026-08-10 (decisions §41)
    concurrency_when_live: 1           # serialized prefills; c=4 agg = 0.92x of c=1
    thinking_field_when_live: content   # inline on the Entrpi fork
    decode_when_live: 18.0 tok/s @34.6k; cold TTFT ~370 s @100k
    revive: bin/rollback-to-ds4.sh   # stops qwen FIRST; weights + disk-KV intact
    note: currently cmd-blocked in llama-swap (bin/eval-window-blocked.sh) so a
          stray request fails loudly instead of spawning a second ~113 GB engine.

