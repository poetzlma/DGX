# Deployed LLM stack manifest — source of truth for downstream proxies (LiteLLM, etc.)
#
# Updated: 2026-05-17
# Gateway: http://192.168.1.12:8079/v1   (log-proxy → llama-swap, OpenAI-compatible)
#                                         underlying engine gateway: :8080 (llama-swap)
#
# All models share the gateway URL — clients route by `model` field.
#
# 2026-05-17 routing change: the two production Qwen3.6 engines (dense
# INT4+DFlash and MoE NVFP4) are now CO-RESIDENT, not swap-exclusive. Both
# stay loaded on the GPU (~104 GB / 119 GB) and serve their own routes in
# parallel. The rest of `main` (sakamaki / aeon / mtp rollbacks, nemotron,
# both deepseek lanes) remain swap-exclusive with each other, but loading
# any of them while the qwen pair is resident will OOM — only ~15 GB free.
# Run `docker rm -f vllm-qwen-27b-int4-dflash` (or the MoE container) to
# free memory before triggering a swap-exclusive engine.
#
# Per-model internal ports (9008–9019) are internal-only while loaded.
#
# Cold-start budget: vLLM models ~2–6 min on first request after swap;
# the ds4 native binary is ~104s cold / ~74s warm. Set request_timeout >=
# 600s on any client to avoid timing out a cold load.
#
# `model_list` block below is drop-in for LiteLLM proxy config. All routes
# go through log-proxy on :8079 so each request is captured to
# ~/llm-stack/logs/proxy/{date}/{model}/ (req+resp+meta triple).

gateway:
  url: http://192.168.1.12:8079/v1
  api_key: not-needed   # LAN-only, no auth
  swap_mode: hybrid     # dense+MoE co-resident; rest swap-exclusive
  request_timeout_min_s: 600

deployed:
  # ─── co-resident pair (both always loaded since 2026-05-17) ──────────
  - name: qwen3.6-27b-int4-dflash
    role: production coding (default qwen3.6-27b route)
    method: Intel/Qwen3.6-27B-int4-AutoRound + z-lab DFlash drafter n=4
    image: ghcr.io/aeon-7/vllm-aeon-ultimate-dflash:qwen36-v4
    aliases: [qwen3.6-27b, qwen3.6-35b-a3b]
    port_internal: 9018
    promoted: 2026-05-17
    coresident_group: qwen-coresident
    config: max-model-len=120000 max-num-seqs=1 gpu-mem-util=0.50
    measured_single_stream_tok_s: 29   # +80% over previous fp8+MTP n=3 prod

  - name: qwen3.6-35b-a3b-nvfp4
    role: throughput lane (MoE, opt-in by explicit name)
    method: RedHatAI/Qwen3.6-35B-A3B-NVFP4 + native MTP n=1 (Scargall recipe)
    image: vllm/vllm-openai:cu130-nightly
    port_internal: 9019
    added: 2026-05-17
    coresident_group: qwen-coresident
    config: max-model-len=80000 max-num-seqs=2 gpu-mem-util=0.40
    measured_single_stream_tok_s: 56   # c=1 short input; 101 agg at c=2

  # ─── swap-exclusive (main group; only one of these at a time, AND
  # neither qwen-coresident member loaded) ─────────────────────────────
  - name: diffusiongemma-26b
    role: eval slot — non-coding / speed lane (Google dLLM, added 2026-06-11)
    method: nvidia/diffusiongemma-26B-A4B-it-NVFP4 (ModelOpt NVFP4), diffusion runner-v2
    image: vllm/vllm-openai:gemma-aarch64-cu130   # day-0 2026-06-10 gemma build
    port_internal: 9021
    added: 2026-06-11
    config: max-model-len=131072 max-num-seqs=4 gpu-mem-util=0.30 attn=TRITON_ATTN
    measured_single_stream_tok_s: 116   # short answer; 218 tok/s on long thinking-mode gen
    note: quality < AR Gemma 4 per Google; speed/breadth lane, not coding-quality

  - name: qwen3.6-27b-fp8
    role: rollback (was prod 2026-05-08 → 2026-05-17)
    method: Qwen official FP8 + native MTP n=3 + --reasoning-parser qwen3
    port_internal: 9016
    demoted: 2026-05-17

  # RETIRED 2026-06-27 (full rollback cleanup): qwen3.6-27b-int4-autoround,
  # -sakamaki-mtp, -aeon-dflash, -mtp. Superseded 27B slots; NVFP4 weights
  # evicted. qwen3.6-27b-fp8 kept above as the single rollback.

  - name: nemotron-3-nano-omni
    role: multimodal omni (text/image/audio/video)
    method: NVFP4
    port_internal: 9012

  # RETIRED 2026-06-27: deepseek-v4-flash (old llama.cpp fork, port 9011).
  # Superseded by -ds4 lane; 81 GB GGUF evicted (ds4 uses its own file).

  - name: deepseek-v4-flash-ds4
    role: planner lane (long-ctx with persistent disk KV cache, decode ~10 t/s)
    method: antirez/ds4 native C/CUDA, IQ2_XXS imatrix + MTP n=2
    port_internal: 9010
    added: 2026-05-12

# ─── LiteLLM model_list (drop into proxy config) ───────────────────────────
# api_base routes through log-proxy on :8079 (NOT :8080). The log-proxy
# transparently forwards to llama-swap and captures req+resp+meta per call.
# Reverting any api_base to :8080 silently drops observability.
model_list:
  - model_name: qwen3.6-27b           # → int4-dflash (co-resident prod, 2026-05-17)
    litellm_params:
      model: openai/qwen3.6-27b
      api_base: http://192.168.1.12:8079/v1
      api_key: not-needed

  - model_name: qwen3.6-27b-int4-dflash
    litellm_params:
      model: openai/qwen3.6-27b-int4-dflash
      api_base: http://192.168.1.12:8079/v1
      api_key: not-needed

  - model_name: qwen3.6-35b-a3b-nvfp4   # MoE throughput lane, co-resident with dense
    litellm_params:
      model: openai/qwen3.6-35b-a3b-nvfp4
      api_base: http://192.168.1.12:8079/v1
      api_key: not-needed

  - model_name: qwen3.6-27b-fp8         # rollback (demoted 2026-05-17)
    litellm_params:
      model: openai/qwen3.6-27b-fp8
      api_base: http://192.168.1.12:8079/v1
      api_key: not-needed

  # retired 2026-06-27: qwen3.6-27b-{int4-autoround,sakamaki-mtp,aeon-dflash,mtp}

  - model_name: diffusiongemma-26b
    litellm_params:
      model: openai/diffusiongemma-26b
      api_base: http://192.168.1.12:8079/v1
      api_key: not-needed

  - model_name: nemotron-3-nano-omni
    litellm_params:
      model: openai/nemotron-3-nano-omni
      api_base: http://192.168.1.12:8079/v1
      api_key: not-needed

  # retired 2026-06-27: deepseek-v4-flash (old llama.cpp fork) — use -ds4

  - model_name: deepseek-v4-flash-ds4
    litellm_params:
      model: openai/deepseek-v4-flash-ds4
      api_base: http://192.168.1.12:8079/v1
      api_key: not-needed

litellm_settings:
  request_timeout: 900   # cold-start headroom; do not lower below 600

