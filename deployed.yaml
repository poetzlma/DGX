# Deployed LLM stack manifest — source of truth for downstream proxies (LiteLLM, etc.)
#
# Updated: 2026-06-27
# Gateway: http://192.168.1.12:8079/v1   (log-proxy → llama-swap, OpenAI-compatible)
#                                         underlying engine gateway: :8080 (llama-swap)
#
# All models share the gateway URL — clients route by `model` field.
#
# 2026-06-27 phase change: EXPERIMENTATION — no fixed production model. Every
# model is a swap-exclusive member of a single llama-swap `experiments` group,
# so each loads ALONE with the full 119 GB (no co-resident pair anymore). The
# first request for a route cold-swaps it in and evicts whatever was resident.
# Contexts were retuned for c=1/2/3 @ 131k where the engine allows (verified
# no-OOM), EXCEPT the two deliberately-narrow lanes: int4-dflash (120k/c=1,
# the DFlash drafter lane) and ds4 (131k planner, decode-bound).
#
# CODING-HARNESS CONTRACT: each engine below carries `context_window:` — the
# per-request token window the downstream coding server must configure. Read
# THAT field, not `config:`. For llama.cpp engines (ornith) it already accounts
# for the --parallel slot split, so context_window != the engine's total ctx.
#
# Per-model internal ports (9010–9022) are internal-only while loaded.
#
# Cold-start budget: vLLM models ~2–6 min on first request after swap;
# the ds4 native binary is ~104s cold / ~74s warm. Set request_timeout >=
# 600s on any client to avoid timing out a cold load.
#
# `model_list` block below is drop-in for LiteLLM proxy config. All routes
# go through log-proxy on :8079 so each request is captured to
# ~/llm-stack/logs/proxy/{date}/{model}/ (req+resp+meta triple).

gateway:
  url: http://192.168.1.12:8079/v1
  api_key: not-needed   # LAN-only, no auth (authed edge is Cloudflare/LiteLLM on .7)
  swap_mode: exclusive  # single `experiments` group; one model resident at a time
  request_timeout_min_s: 600

deployed:
  # All members of the single swap-exclusive `experiments` group (one resident
  # at a time). config = what the launcher actually serves; verified no-OOM.

  - name: nemotron-3-puzzle-75b
    role: coding DEFAULT under test (qwen3.6-27b / qwen3.6-35b-a3b aliases resolve here) — set 2026-07-08
    method: nvidia/NVIDIA-Nemotron-Labs-3-Puzzle-75B-A9B-NVFP4 (hybrid Mamba+MoE+Attn, 9.3B active) + native MTP n=1 + CUDA graphs
    image: ghcr.io/aeon-7/aeon-vllm-ultimate:latest   # vLLM 0.23.0+aeon.sm121a.dflash — MTP+graphs work on sm_121 (Mamba #37431 eager-tax NOT binding here)
    aliases: [qwen3.6-27b, qwen3.6-35b-a3b]
    port_internal: 9027
    added: 2026-07-08
    context_window: 131072   # per-request window for the coding harness (engine max-model-len 131072; native 262144)
    config: max-model-len=131072 max-num-seqs=8 gpu-mem-util=0.85 kv=bf16 mamba-cache=fp32 VLLM_NVFP4_GEMM_BACKEND=flashinfer-cutlass speculative=mtp:n1
    measured_single_stream_tok_s: 28   # MTP n=1 accept ~81%; agg short c4=81, 125k c1=20/c4=12. n=2 variant peaks 33 c1 single-stream
    note: reasoning model — <think>…</think> currently leaks into content (no --reasoning-parser); beats dense 27B at long ctx, slower than 35B MoE (memory project_nemotron_puzzle_75b)

  - name: qwen3.6-27b-int4-dflash
    role: former coding default — aliases moved to nemotron-3-puzzle-75b 2026-07-08 (ROLLBACK target)
    method: Intel/Qwen3.6-27B-int4-AutoRound + z-lab DFlash drafter n=4
    image: ghcr.io/aeon-7/vllm-aeon-ultimate-dflash:qwen36-v4
    port_internal: 9018
    context_window: 120000   # per-request window for the coding harness
    config: max-model-len=120000 max-num-seqs=1 gpu-mem-util=0.50   # narrow by design (DFlash lane)
    measured_single_stream_tok_s: 29   # +80% over previous fp8+MTP n=3 prod

  - name: qwen3.6-35b-a3b-nvfp4
    role: throughput lane (MoE, opt-in by explicit name)
    method: RedHatAI/Qwen3.6-35B-A3B-NVFP4 + native MTP n=1 (Scargall recipe)
    image: vllm/vllm-openai:cu130-nightly
    port_internal: 9019
    context_window: 131072   # per-request window for the coding harness
    config: max-model-len=131072 max-num-seqs=3 gpu-mem-util=0.70   # retuned 2026-06-27 (was 80k/2/0.40)
    measured_single_stream_tok_s: 56   # c=1 short input; 101 agg at c=2

  - name: qwen3.6-35b-a3b-vision
    role: eval — VISION lane for the 35B MoE (the -nvfp4 lane is text-only); also fastest 35B c=1 measured
    method: unsloth/Qwen3.6-35B-A3B-GGUF UD-Q4_K_XL (dynamic 4-bit, 22.4 GB) + mmproj-F16 vision encoder
    image: native (~/llama.cpp/build/bin/llama-server, mainline CUDA sm_121 — same binary as ornith)
    port_internal: 9026
    added: 2026-07-07
    context_window: 131072   # per-request window — NOT the 262144 engine total (llama.cpp splits ctx across the 2 parallel slots)
    config: ctx=262144 parallel=2 mmproj=F16   # engine total: 2 slots x 131072 = c=2 @ 131k
    measured_single_stream_tok_s: 69   # text decode; 67 tok/s on vision requests — beats the vLLM NVFP4 lane's 56
    notes: accepts image_url content blocks; shape/colour recognition verified 2026-07-07; thinking model → pass chat_template_kwargs enable_thinking=false for terse replies, else give generous max_tokens

  - name: qwen3.6-27b-nvfp4
    role: eval — NVIDIA official NVFP4 (ModelOpt) hybrid Qwen3_5 27B, throughput lane
    method: nvidia/Qwen3.6-27B-NVFP4 (qwen3_5 hybrid, W4A16-NVFP4) + z-lab DFlash drafter n=10
    image: ghcr.io/aeon-7/aeon-vllm-ultimate:latest   # vLLM 0.23.0+aeon.sm121a.dflash — sm_121 CUTLASS NVFP4 (stock image gives Marlin garbage on GB10)
    port_internal: 9024
    added: 2026-06-30
    context_window: 262144   # native 256k (max_position_embeddings=262144, NO RoPE scaling); 254k req verified HTTP 200 (2026-07-01)
    config: max-model-len=262144 max-num-seqs=4 gpu-mem-util=0.85 kv=bf16 mamba-cache=fp32 VLLM_NVFP4_GEMM_BACKEND=flashinfer-cutlass   # KV pool 674k tok = 2.57x concurrency @ full 256k; c=4 fine up to ~150k each (hybrid: only 16/64 layers carry growing KV)
    measured_single_stream_tok_s: 31   # DFlash n=10 (MTP n=1 18.6); c2=56 c4=103 agg; decode falloff w/ ctx: 31 short / 26.8 @118k / 15.1 @254k; cold prefill ~144s @118k, ~438s @254k

  - name: qwen3.6-27b-nvfp4-vision
    role: eval — VISION-enabled twin of qwen3.6-27b-nvfp4 (same NVFP4 weights, vision encoder loaded)
    method: nvidia/Qwen3.6-27B-NVFP4 (qwen3_5 hybrid, W4A16-NVFP4, qwen3_5_vision encoder) + z-lab DFlash drafter n=10
    image: ghcr.io/aeon-7/aeon-vllm-ultimate:latest   # same AEON sm_121a CUTLASS NVFP4 image; vision path verified working on GB10 2026-07-05
    port_internal: 9025
    added: 2026-07-05
    context_window: 262144   # unchanged from text lane — vision encoder adds negligible footprint, no ctx reduction needed
    config: max-model-len=262144 max-num-seqs=4 gpu-mem-util=0.85 kv=bf16 mamba-cache=fp32 limit-mm-per-prompt=image:4,video:0 VLLM_NVFP4_GEMM_BACKEND=flashinfer-cutlass   # DELTA vs 9024: dropped --language-model-only, added --limit-mm-per-prompt
    notes: accepts image_url content blocks; shape/colour/spatial perception accurate, OCR of stylised text soft; thinking model → answer in reasoning_content, use generous max_tokens

  - name: qwen3.6-27b-fp8
    role: rollback (was prod 2026-05-08 → 2026-05-17)
    method: Qwen official FP8 + native MTP n=3 + --reasoning-parser qwen3
    port_internal: 9016
    context_window: 131072   # per-request window for the coding harness
    config: max-model-len=131072 max-num-seqs=3 gpu-mem-util=0.80   # retuned 2026-06-27 (was 200k/2/0.70)

  - name: qwopus3.6-27b-int4-dflash
    role: eval — Opus-trace-distilled 27B coding fine-tune (Jackrong)
    method: locally INT4 AutoRound-quantized Qwopus + z-lab DFlash drafter n=4
    image: ghcr.io/aeon-7/vllm-aeon-ultimate-dflash:qwen36-v4
    port_internal: 9020
    added: 2026-06-27
    context_window: 131072   # per-request window for the coding harness
    config: max-model-len=131072 max-num-seqs=2 gpu-mem-util=0.85   # c=2 (bf16 KV ceiling)

  - name: ornith-1.0-35b
    role: eval — DeepReinforce 35B-A3B MoE (qwen35moe arch, agentic coding, MIT)
    method: Q4_K_M GGUF via mainline llama.cpp (CUDA, sm_121)
    image: native (~/llama.cpp/build/bin/llama-server)
    port_internal: 9022
    added: 2026-06-27
    context_window: 131072   # per-request window for the coding harness — NOT the 393216 engine total (llama.cpp splits ctx across the 3 parallel slots)
    config: ctx=393216 parallel=3   # engine total: 3 slots x 131072 = c=3 @ 131k

  - name: diffusiongemma-26b
    role: eval — non-coding / speed lane (Google dLLM, added 2026-06-11)
    method: nvidia/diffusiongemma-26B-A4B-it-NVFP4 (ModelOpt NVFP4), diffusion runner-v2
    image: vllm/vllm-openai:gemma-aarch64-cu130   # day-0 2026-06-10 gemma build
    port_internal: 9021
    context_window: 131072   # per-request window for the coding harness
    config: max-model-len=131072 max-num-seqs=4 gpu-mem-util=0.30 attn=TRITON_ATTN
    measured_single_stream_tok_s: 116   # short answer; 218 tok/s on long thinking-mode gen
    note: quality < AR Gemma 4 per Google; speed/breadth lane, not coding-quality

  - name: cosmos3-nano-omni
    role: eval — NVIDIA Cosmos3-Nano omni world model (text→image/video/audio generation)
    method: nvidia/Cosmos3-Nano (~15B omni) via vLLM-Omni; local ~/cosmos3/models/Cosmos3-Nano served
    image: vllm/vllm-omni:cosmos3-aarch64   # Cosmos3 vLLM-Omni build for GB10/aarch64
    port_internal: 9023
    added: 2026-06-27
    endpoints: [/v1/videos, /v1/videos/sync, /v1/images/generations]   # generation model — NOT /v1/chat/completions
    config: --omni --trust-remote-code   # gen model: no token context_window; fits ~30 GB BF16
    note: Cosmos3-Super (64B) is multi-GPU-only and stays standalone in ~/cosmos3 (not swappable on one GB10)

  - name: nemotron-3-nano-omni
    role: multimodal omni (text/image/audio/video)
    method: nvidia/Nemotron-3-Nano-Omni-30B-A3B-Reasoning-NVFP4 (Mamba2-Transformer hybrid MoE)
    image: vllm/vllm-openai:cu130-nightly-omni
    port_internal: 9012
    context_window: 131072   # per-request window for the coding harness
    config: max-model-len=131072 max-num-seqs=8 gpu-mem-util=0.72   # retuned 2026-06-27 (util 0.65→0.72)
    measured_agg_tok_s: 383   # c=8 peak

  - name: deepseek-v4-flash-ds4
    role: planner lane (long-ctx with persistent disk KV cache, decode-bound)
    method: antirez/ds4 native C/CUDA (mainline-rebased 2026-06-27), IQ2_XXS imatrix + custom Q4 decode
    port_internal: 9010
    added: 2026-05-12
    context_window: 131072   # per-request window for the coding harness
    config: ctx=131072   # decode ~21 t/s (custom Q4 dense decode; MTP off)

  # RETIRED 2026-06-27: qwen3.6-27b-{int4-autoround,sakamaki-mtp,aeon-dflash,mtp}
  # (superseded 27B rollback slots, NVFP4 weights evicted) and deepseek-v4-flash
  # (old llama.cpp fork :9011, 81 GB GGUF evicted — use -ds4).

